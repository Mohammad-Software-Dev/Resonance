name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install M0.18 asset authoring dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 trimesh==4.11.1
      - run: pnpm install --no-frozen-lockfile
      - name: Generate M0.18 authored v3 assets
        run: pnpm assets:m0:v3
      - name: Validate M0.18 authored v3 assets
        run: pnpm assets:m0:v3:validate

      - run: pnpm typecheck
      - name: Validate deployed-smoke script syntax
        run: node --check tools/smoke-deployed-m0.mjs
      - run: pnpm test
      - name: Verify canonical replay fingerprint
        run: |
          pnpm --filter @resonance/replay-cli exec tsx src/cli.ts --fingerprint > /tmp/m0-canonical.fingerprint.json
          diff -u packages/test-fixtures/replays/m0-canonical.fingerprint.json /tmp/m0-canonical.fingerprint.json
      - run: pnpm --filter @resonance/replay-cli replay --generate ../../packages/test-fixtures/replays/m0-canonical.json
      - run: pnpm test:replay
      - run: pnpm test:replay:matrix
      - uses: actions/upload-artifact@v4
        with:
          name: m0-canonical-replay
          path: packages/test-fixtures/replays/m0-canonical.json
          if-no-files-found: error
          retention-days: 7
      - run: pnpm build
      - run: pnpm check:bundle
      - name: Validate M0 evidence deployment
        run: pnpm deploy:m0:evidence:dry-run

  replay-browser:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install M0.18 asset authoring dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 trimesh==4.11.1
      - run: pnpm install --no-frozen-lockfile
      - name: Generate M0.18 authored v3 assets
        run: pnpm assets:m0:v3
      - name: Validate M0.18 authored v3 assets
        run: pnpm assets:m0:v3:validate

      - uses: actions/download-artifact@v4
        with:
          name: m0-canonical-replay
          path: packages/test-fixtures/replays
      - name: Install browser runtime
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - name: Start replay harness server
        run: |
          pnpm --filter @resonance/web-client dev --host 127.0.0.1 --port 4173 > /tmp/resonance-replay-vite.log 2>&1 &
          echo $! > /tmp/resonance-replay-vite.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/replay.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/resonance-replay-vite.log
          exit 1
      - run: pnpm exec playwright test --project=${{ matrix.browser }}
      - name: Retain presentation smoke screenshot
        if: matrix.browser == 'chromium'
        uses: actions/upload-artifact@v4
        with:
          name: wayfarer-scar-presentation-smoke
          path: artifacts/presentation-smoke
          if-no-files-found: error
          retention-days: 14
      - name: Stop replay harness server
        if: always()
        run: |
          if [ -f /tmp/resonance-replay-vite.pid ]; then
            kill "$(cat /tmp/resonance-replay-vite.pid)" 2>/dev/null || true
          fi
