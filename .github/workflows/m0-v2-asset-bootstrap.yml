name: Bootstrap M0.14 authored v2 assets

on:
  push:
    branches:
      - "m0/authored-visual-identity-v2"
    paths:
      - "tools/asset-pipeline/generate_m0_v2_assets.py"
      - ".github/workflows/m0-v2-asset-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m0/authored-visual-identity-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install authoring dependencies
        run: python -m pip install --disable-pip-version-check numpy trimesh
      - name: Generate versioned GLBs
        run: python tools/asset-pipeline/generate_m0_v2_assets.py apps/web-client/public/assets/visual
      - name: Commit generated runtime assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             apps/web-client/public/assets/visual/characters/wayfarer-mara-m0-v2.glb             apps/web-client/public/assets/visual/enemies/scrapper-damaged-m0-v2.glb             apps/web-client/public/assets/visual/environment/wayfarer-scar-setdress-m0-v2.glb
          if git diff --cached --quiet; then
            echo "Generated assets already match."
            exit 0
          fi
          git commit -m "assets: regenerate Y-up M0.14 authored v2 runtime GLBs"
          git push origin HEAD:m0/authored-visual-identity-v2
