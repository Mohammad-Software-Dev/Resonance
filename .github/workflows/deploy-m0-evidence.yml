name: Deploy M0 Evidence Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/M0_EVIDENCE_DEPLOY_REQUEST.md"

permissions:
  contents: read

concurrency:
  group: deploy-m0-evidence
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions repository secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions repository secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          exit "$missing"
      - name: Record established evidence URL
        run: |
          echo "CLOUDFLARE_WORKERS_SUBDOMAIN=resonance-mohammad-dev" >> "$GITHUB_ENV"
          echo "M0_EVIDENCE_URL=https://resonance-m0-evidence.resonance-mohammad-dev.workers.dev" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install M0.18 asset authoring dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.3.5 trimesh==4.11.1
      - run: pnpm install --no-frozen-lockfile
      - name: Generate M0.18 authored v3 assets
        run: pnpm assets:m0:v3
      - name: Validate M0.18 authored v3 assets
        run: pnpm assets:m0:v3:validate

      - name: Record evidence build SHA
        run: echo "M0_EVIDENCE_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify canonical replay fingerprint
        run: |
          pnpm --filter @resonance/replay-cli exec tsx src/cli.ts --fingerprint > /tmp/m0-canonical.fingerprint.json
          diff -u packages/test-fixtures/replays/m0-canonical.fingerprint.json /tmp/m0-canonical.fingerprint.json
      - name: Generate canonical replay artifact
        run: pnpm --filter @resonance/replay-cli replay --generate ../../packages/test-fixtures/replays/m0-canonical.json
      - run: pnpm test:replay
      - run: pnpm test:replay:matrix
      - name: Build evidence client
        run: pnpm build
        env:
          VITE_BUILD_ID: ${{ env.M0_EVIDENCE_BUILD_SHA }}
      - run: pnpm check:bundle
      - name: Deploy to Cloudflare Workers Static Assets
        run: pnpm deploy:m0:evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install deployed-smoke browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke-test deployed evidence build
        run: pnpm smoke:m0:evidence
      - name: Retain deployed smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-deployed-smoke-${{ github.sha }}
          path: artifacts/m0-evidence-smoke
          if-no-files-found: warn
          retention-days: 30
