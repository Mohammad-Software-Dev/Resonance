name: Deploy M0 Evidence Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/cloudflare/M0_EVIDENCE_DEPLOY_REQUEST.md"

permissions:
  contents: read

concurrency:
  group: deploy-m0-evidence
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cloudflare deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Missing GitHub Actions repository secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing GitHub Actions repository secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          exit "$missing"
      - name: Ensure workers.dev account subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          response="$(curl --silent --show-error --write-out '\n%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$endpoint")"
          body="$(printf '%s\n' "$response" | sed '$d')"
          status="$(printf '%s\n' "$response" | tail -n1)"

          if [ "$status" = "200" ] && printf '%s' "$body" | grep -q '"success":true'; then
            subdomain="$(printf '%s' "$body" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).result.subdomain))")"
            echo "Using existing workers.dev account subdomain: $subdomain"
          else
            echo "No workers.dev account subdomain is configured; creating resonance-mohammad-dev."
            create_response="$(curl --silent --show-error --fail-with-body \
              -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"subdomain":"resonance-mohammad-dev"}' \
              "$endpoint")"
            subdomain="$(printf '%s' "$create_response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success)process.exit(1);process.stdout.write(j.result.subdomain)})")"
            echo "Created workers.dev account subdomain: $subdomain"
          fi

          echo "CLOUDFLARE_WORKERS_SUBDOMAIN=$subdomain" >> "$GITHUB_ENV"
          echo "M0_EVIDENCE_URL=https://resonance-m0-evidence.$subdomain.workers.dev" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - run: pnpm install --no-frozen-lockfile
      - name: Record evidence build SHA
        run: echo "M0_EVIDENCE_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify canonical replay fingerprint
        run: |
          pnpm --filter @resonance/replay-cli exec tsx src/cli.ts --fingerprint > /tmp/m0-canonical.fingerprint.json
          diff -u packages/test-fixtures/replays/m0-canonical.fingerprint.json /tmp/m0-canonical.fingerprint.json
      - name: Generate canonical replay artifact
        run: pnpm --filter @resonance/replay-cli replay --generate ../../packages/test-fixtures/replays/m0-canonical.json
      - run: pnpm test:replay
      - run: pnpm test:replay:matrix
      - name: Build evidence client
        run: pnpm build
        env:
          VITE_BUILD_ID: ${{ env.M0_EVIDENCE_BUILD_SHA }}
      - run: pnpm check:bundle
      - name: Deploy to Cloudflare Workers Static Assets
        run: pnpm deploy:m0:evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Install deployed-smoke browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke-test deployed evidence build
        run: pnpm smoke:m0:evidence
      - name: Retain deployed smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m0-deployed-smoke-${{ github.sha }}
          path: artifacts/m0-evidence-smoke
          if-no-files-found: warn
          retention-days: 30
